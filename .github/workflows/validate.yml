name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # TODO: remove this once the integration is listed in
          # home-assistant/brands. HACS wants an icon and a logo for the
          # skedda_scheduler domain, submitted as a pull request to that
          # repository; until then this check can only fail. Installing as a
          # custom repository works without them - being listed in the default
          # HACS catalogue does not. Drop the line, do not extend it: every
          # other check here is one we intend to pass.
          ignore: brands
